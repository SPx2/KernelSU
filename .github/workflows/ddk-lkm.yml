name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
      disable_cfi:
        description: 'disable CFI (Control Flow Integrity) for non-CFI Samsung kernels'
        required: false
        default: false
        type: boolean
      disable_scs:
        description: 'disable SCS (Shadow Call Stack) for non-SCS Samsung kernels'
        required: false
        default: false
        type: boolean

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Apply DDK compatibility overrides
      env:
        DISABLE_CFI: ${{ inputs.disable_cfi }}
        DISABLE_SCS: ${{ inputs.disable_scs }}
      run: |
        set -euo pipefail

        : "${KDIR:?KDIR is not set}"

        AUTOCONF_H="$KDIR/include/generated/autoconf.h"
        AUTO_CONF="$KDIR/include/config/auto.conf"

        [ -f "$AUTOCONF_H" ]
        [ -f "$AUTO_CONF" ]

        disable_config() {
          symbol="$1"
          sed -i "s@^#define ${symbol} 1\$@/* & */ // disabled to match target kernel@" "$AUTOCONF_H"
          sed -i "s@^\(${symbol}\)=y\$@# \1 is not set@" "$AUTO_CONF"
          if grep -q "^#define ${symbol} 1\$" "$AUTOCONF_H" || \
             grep -q "^${symbol}=y\$" "$AUTO_CONF"; then
            echo "ERROR: $symbol is still enabled"
            return 1
          fi
          echo "OK: $symbol disabled"
        }

        if [ "${DISABLE_CFI:-false}" = "true" ]; then
          disable_config CONFIG_CFI_CLANG
        fi

        if [ "${DISABLE_SCS:-false}" = "true" ]; then
          disable_config CONFIG_SHADOW_CALL_STACK
        fi

        echo "=== Effective DDK configuration ==="
        grep -E 'CONFIG_(CFI_CLANG|SHADOW_CALL_STACK)' "$AUTO_CONF" || true

    - name: Build kernelsu.ko
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$PACKAGE_NAME" ]; then
          export PACKAGE_NAME="${PACKAGE_NAME}.pr"
        fi

        EXTRA_ARGS=""
        if [ -n "$PACKAGE_NAME" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_PACKAGE_NAME=$PACKAGE_NAME"
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        fi
        if [ -n "$EXPECTED_HASH" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          EXTRA_ARGS="$EXTRA_ARGS KSU_IS_PR_BUILD=1"
        fi
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko

